name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-features
      - run: cargo test --no-default-features

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc --no-deps --no-default-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --target wasm32-unknown-unknown --no-default-features
      - run: cargo build --target wasm32-unknown-unknown --no-default-features --features wasm

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo check --all-features --locked
      - run: cargo check --no-default-features --locked

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NVlabs/flip
          ref: b475eb4bf394ab877c42166c9eb0a84a02cc5b14
          path: nvlabs-flip
      - uses: dtolnay/rust-toolchain@stable
      - name: Short oracle sweep
        run: ./parity/sweep.sh --count 200
        env:
          FLIP_RS_REFERENCE: ${{ github.workspace }}/nvlabs-flip
          FLIP_RS_REPORT: parity/build/sweep-ci.md
      - name: HDR near-tie oracle regressions
        run: cargo test --release --no-default-features --test parity hdr_near_ties_preserve_reference_exposure_indices
        env:
          FLIP_RS_PARITY_BIN: ${{ github.workspace }}/parity/build/reference
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-sweep
          path: parity/build/sweep-ci.md
