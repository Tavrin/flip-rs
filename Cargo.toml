[package]
name = "flip-rs"
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
description = "Rust port of NVIDIA FLIP v1.7, a perceptual image-difference metric for LDR and HDR images"
authors = ["flip-rs contributors"]
license = "BSD-3-Clause"
repository = "https://github.com/Tavrin/flip-rs"
homepage = "https://tavrin.github.io/flip-rs/"
readme = "README.md"
keywords = ["flip", "nvidia", "perceptual", "visual-regression", "hdr"]
categories = ["multimedia::images", "graphics", "wasm"]
include = [
    "/src/**/*.rs",
    "/tests/api.rs",
    "/examples/compare.rs",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["parallel"]
parallel = ["dep:rayon"]
image = ["dep:image"]
wasm = ["dep:wasm-bindgen", "dep:js-sys"]

[dependencies]
rayon = { version = "1.10", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "exr"], optional = true }
wasm-bindgen = { version = "0.2.114", optional = true }
js-sys = { version = "0.3.91", optional = true }

[[example]]
name = "compare"
required-features = ["image"]

[[example]]
name = "parity"
required-features = ["image"]

[[example]]
name = "showcase"
required-features = ["image"]

[package.metadata.docs.rs]
all-features = true
