<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FLIP image comparison</title>
<link rel="icon" href="data:,">
<style>
  :root{font-family:system-ui,sans-serif;color:#edeef5;background:#15151d}body{max-width:980px;margin:48px auto;padding:0 24px}h1{font-size:32px;margin-bottom:8px}p{color:#b5b7c8;line-height:1.6}.inputs{display:flex;gap:20px;margin:28px 0}.drop{flex:1;border:1px dashed #74768c;border-radius:12px;padding:28px;min-width:0}.drop.over{background:#292b40}input{max-width:100%;margin-top:12px}button{background:#bf6cfa;color:#17151c;padding:12px 24px;border:0;border-radius:8px;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:wait}label{display:block}#ppd{width:100px;margin:0 16px 20px 8px}canvas{max-width:100%;height:auto;margin-top:20px;border-radius:8px}#status{min-height:24px;color:#ddd0ed}.preview{display:block;max-height:180px;max-width:100%;margin-top:16px}@media(max-width:640px){.inputs{flex-direction:column}}
</style>
<h1>Compare what you see</h1>
<p>LDR-FLIP estimates visible differences between two sRGB images. Drop images of equal dimensions, then compare. Alpha is ignored. The Magma heatmap runs locally in WebAssembly.</p>
<div class="inputs">
  <div class="drop" id="reference"><label>Reference image <input type="file" accept="image/*"></label><img class="preview" alt=""></div>
  <div class="drop" id="test"><label>Test image <input type="file" accept="image/*"></label><img class="preview" alt=""></div>
</div>
<label>Pixels per degree <input id="ppd" type="number" value="67.020645" min="5" step="0.01"></label>
<button id="compare" disabled>Compare images</button>
<p id="status" role="status">Loading WebAssembly…</p>
<canvas id="heatmap" aria-label="FLIP error heatmap"></canvas>
<script type="module">
import init, { ldrFlip } from '../../pkg/flip_rs.js';
import { magma } from './magma.js';
const status = document.querySelector('#status'), button = document.querySelector('#compare');
const images = {};
let ready = false;
async function load(name, file) {
  if (!file) return;
  try {
    const bitmap = await createImageBitmap(file, {premultiplyAlpha:'none', colorSpaceConversion:'default'});
    const canvas = document.createElement('canvas'); canvas.width = bitmap.width; canvas.height = bitmap.height;
    const ctx = canvas.getContext('2d', {willReadFrequently:true}); ctx.drawImage(bitmap,0,0);
    images[name] = ctx.getImageData(0,0,canvas.width,canvas.height); bitmap.close();
    document.querySelector(`#${name} img`).src = canvas.toDataURL();
    status.textContent = `${name}: ${canvas.width} × ${canvas.height}`;
    button.disabled = !ready || !images.reference || !images.test;
  } catch(e) { status.textContent = `Could not load image: ${e.message}`; }
}
for (const name of ['reference','test']) {
  const box = document.getElementById(name);
  box.querySelector('input').addEventListener('change', e=>load(name,e.target.files[0]));
  box.addEventListener('dragover',e=>{e.preventDefault();box.classList.add('over');});
  box.addEventListener('dragleave',()=>box.classList.remove('over'));
  box.addEventListener('drop',e=>{e.preventDefault();box.classList.remove('over');load(name,e.dataTransfer.files[0]);});
}
button.addEventListener('click', async()=>{
  button.disabled = true; status.textContent = 'Computing FLIP…';
  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
  try {
    const r=images.reference,t=images.test;
    if(r.width!==t.width||r.height!==t.height) throw Error('Images must have equal dimensions.');
    const errors=ldrFlip(r.data,t.data,r.width,r.height,Number(document.getElementById('ppd').value));
    const canvas=document.getElementById('heatmap'); canvas.width=r.width; canvas.height=r.height;
    const ctx=canvas.getContext('2d'), output=ctx.createImageData(r.width,r.height);
    let sum=0;
    errors.forEach((v,i)=>{sum+=v;const rgb=magma[Math.min(255,Math.max(0,Math.floor(v*255+.5)))];for(let c=0;c<3;c++)output.data[i*4+c]=Math.floor(rgb[c]*255+.5);output.data[i*4+3]=255;});
    ctx.putImageData(output,0,0); status.textContent=`Mean error: ${(sum/errors.length).toFixed(6)} · ${r.width} × ${r.height}`;
  } catch(e) { status.textContent = e.message || String(e); }
  finally {button.disabled=false;}
});
try{await init();ready=true;button.disabled=!images.reference||!images.test;status.textContent='Ready. Choose or drop two images.';}catch(e){status.textContent=`Build pkg/ first: ${e.message}`;}
</script>
</html>
